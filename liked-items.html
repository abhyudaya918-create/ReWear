<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#faf8f5">
    <title>Liked Items | ReWear</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="liked-page">
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="ReWear home">
            <span class="brand-mark" aria-hidden="true">↻</span>
            <span>ReWear</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="add-listing.html">Add Listing</a>
            <a class="active" href="liked-items.html" aria-current="page">Liked Items</a>
        </nav>
        <div class="account-area">
            <a class="sign-in-link" data-auth-signin href="sign-in.html">Sign in</a>
            <a class="profile-link" href="profile.html" aria-label="Profile">
                <span class="profile-avatar" data-auth-avatar aria-hidden="true">RW</span>
            </a>
        </div>
    </header>

    <main class="liked-main">
        <div class="liked-heading-row">
            <div>
                <p class="home-eyebrow">YOUR COLLECTION</p>
                <h1 class="liked-title">Liked items</h1>
                <p class="liked-description">Items you like will be easy to find here.</p>
            </div>
        </div>

        <section class="liked-items-view" id="saved-items-view" aria-label="Saved listings">
            <div class="listing-grid" id="liked-listing-grid" aria-live="polite"></div>
        </section>
        <p class="listing-load-message" id="liked-listings-status" role="status" aria-live="polite">Loading saved items…</p>

        <section class="empty-saved-state" id="empty-saved-state" aria-labelledby="empty-title" hidden>
            <span class="empty-heart" aria-hidden="true">♡</span>
            <h2 id="empty-title">No saved items yet.</h2>
            <p>When you save an item, it’ll appear here so you can find it again.</p>
            <a class="home-button primary-button" href="browse.html">Browse Items <span aria-hidden="true">→</span></a>
        </section>
    </main>
    <script type="module" src="script.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
