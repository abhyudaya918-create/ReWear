<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#faf8f5">
    <title>Sign in | ReWear</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="sign-in-page">
    <header class="site-header">
        <a class="brand" href="index.html" aria-label="ReWear home">
            <span class="brand-mark" aria-hidden="true">↻</span>
            <span>ReWear</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="browse.html">Browse</a>
        </nav>
        <span aria-hidden="true"></span>
    </header>
    <main class="sign-in-main">
        <section class="sign-in-panel" aria-labelledby="sign-in-title">
            <span class="sign-in-mark" aria-hidden="true">↻</span>
            <p class="home-eyebrow">REUSE WITHIN YOUR SCHOOL COMMUNITY</p>
            <h1 id="sign-in-title">Welcome to ReWear</h1>
            <p class="sign-in-description">Sign in to share useful items with your school community and save your favourites.</p>
            <button class="google-sign-in-button" id="google-sign-in" type="button">
                <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.24 5.48-4.7 7.18l7.2 5.59c4.2-3.88 7.54-9.58 7.54-17.24Z"/><path fill="#FBBC05" d="M10.54 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.12.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.88.93 7.55 2.56 10.78l7.98-6.19Z"/><path fill="#34A853" d="M24 48c6.47 0 11.91-2.13 15.88-5.79l-7.2-5.59c-2 1.35-4.56 2.16-8.68 2.16-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/></svg>
                <span>Continue with Google</span>
            </button>
            <p class="auth-status" id="auth-status" role="status" aria-live="polite"></p>
            <a class="sign-in-back-link" href="index.html">← Back to home</a>
        </section>
    </main>
    <script type="module" src="auth.js"></script>
</body>
</html>
